# URSim (Universal Robots e-Series simulator) for the workshop notebooks.
#   docker compose up -d      -> start
#   http://localhost:6080/vnc.html  -> Polyscope GUI in the browser
#   docker compose down       -> stop
services:
  ursim:
    image: universalrobots/ursim_e-series:latest
    container_name: ursim
    environment:
      ROBOT_MODEL: UR5
    ports:
      - "127.0.0.1:6080:6080"     # noVNC web GUI (Polyscope)
      - "127.0.0.1:29999:29999"   # Dashboard server
      - "127.0.0.1:30001:30001"   # Primary interface
      - "127.0.0.1:30002:30002"   # Secondary interface
      - "127.0.0.1:30003:30003"   # Real-time interface
      - "127.0.0.1:30004:30004"   # RTDE
    volumes:
      - ./ursim/programs:/ursim/programs
      - ./ursim/urcaps:/urcaps
      # Pre-enable Remote Control (Settings → System → Remote Control) so it survives `docker compose down`.
      - ./ursim/polyscope/remotecontrol.properties:/ursim/.polyscope/remotecontrol.properties:ro
    restart: "no"
