[project]
name = "cobotique"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python<5",
    "polars>=2.1.0",
    "pyobjc-framework-avfoundation>=13.0 ; sys_platform == 'darwin'",
    "ur-rtde>=1.6.5",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cobot"   # src/cobot, installed editable by `uv sync`

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ursim: needs a running URSim (deselect with -m 'not ursim')"]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pytest>=9.2.0",
]
